<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planwise — Personal Financial Planner</title>
<meta name="description" content="Plan your money in one place: track income and expenses, set savings goals, see a 12-month forecast and get monthly suggestions. Your plan stays in your browser and can be saved to a file.">
<meta name="theme-color" content="#0D9488">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
</svg>

<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side">
    <a class="logo" href="#/dashboard" aria-label="Planwise, dashboard"><span class="lm" aria-hidden="true">P</span>Planwise</a>
    <nav class="tabs" aria-label="Planner sections" data-tabs>
      <a href="#/dashboard" data-tab="dashboard"><svg class="i"><use href="#i-home"/></svg><span>Dashboard</span></a>
      <a href="#/income" data-tab="income"><svg class="i"><use href="#i-in"/></svg><span>Income</span></a>
      <a href="#/expenses" data-tab="expenses"><svg class="i"><use href="#i-out"/></svg><span>Expenses</span></a>
      <a href="#/goals" data-tab="goals"><svg class="i"><use href="#i-target"/></svg><span>Goals</span></a>
      <a href="#/forecast" data-tab="forecast"><svg class="i"><use href="#i-trend"/></svg><span>Forecast</span></a>
      <a href="#/suggestions" data-tab="suggestions"><svg class="i"><use href="#i-bulb"/></svg><span>Suggestions</span></a>
    </nav>
    <div class="file">
      <p class="file-h">Your plan file</p>
      <button class="btn-o sm" type="button" data-save><svg class="i"><use href="#i-save"/></svg>Save plan (.json)</button>
      <label class="btn-o sm" tabindex="0" data-load-l><svg class="i"><use href="#i-upload"/></svg>Load plan<input class="sr" type="file" accept="application/json,.json" data-load tabindex="-1"></label>
      <button class="btn-o sm" type="button" data-csv><svg class="i"><use href="#i-dl"/></svg>Export CSV</button>
      <button class="btn-g sm" type="button" data-reset><svg class="i"><use href="#i-reset"/></svg>Reset…</button>
      <p class="priv">Saved automatically in this browser only. Nothing is uploaded.</p>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1" data-view></main>
</div>
<dialog class="dlg" data-dlg aria-labelledby="dlg-title"><form method="dialog" novalidate data-dlg-body></form></dialog>
<div class="toasts" role="status" aria-live="polite" data-toasts></div>
<script src="app.js"></script>
</body>
</html>
