<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FBF3E4">
    <meta name="description" content="Larkspur: a warm little five-letter puzzle. Six tries, forty handpicked words, and no rush.">
    <title>Larkspur — a five-letter puzzle</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.mjs"></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="wordmark" href="./index.html" aria-label="Larkspur home">Larkspur<span class="brand-dot"></span></a>
            <div class="top-actions">
                <button class="icon-button" id="help-button" aria-label="How to play" title="How to play"></button>
                <button class="icon-button" id="stats-button" aria-label="Your statistics" title="Your statistics" aria-expanded="false"></button>
            </div>
        </header>
        <main>
            <section class="intro" aria-labelledby="headline">
                <p class="eyebrow" id="eyebrow"></p>
                <h1 id="headline"></h1>
                <div class="round-meta"><span class="puzzle-pill" id="puzzle-label"></span><span id="round-subtitle"></span></div>
            </section>
            <section class="play-area" aria-label="Word puzzle">
                <div class="board" id="board" role="group" aria-label="Six guesses of five letters" tabindex="-1"></div>
                <p class="board-status" id="board-status" aria-live="polite"></p>
            </section>
            <section id="keyboard" class="keyboard" aria-label="On-screen keyboard"></section>
            <section id="result-panel" class="result-panel" aria-label="Round result" hidden tabindex="-1">
                <p class="eyebrow" id="result-kicker"></p>
                <h2 id="result-heading"></h2>
                <p class="answer" id="answer"></p>
                <p class="loss-copy" id="loss-copy" hidden></p>
                <div id="result-stats"></div>
                <div class="result-actions">
                    <button class="primary" id="copy-button"></button>
                    <button class="ghost" id="next-button"></button>
                </div>
                <textarea id="share-fallback" class="share-fallback" readonly aria-label="Select and copy your result" hidden></textarea>
                <p class="rotation" id="rotation"></p>
            </section>
            <section id="stats-panel" class="result-panel" aria-label="Your statistics" hidden tabindex="-1">
                <p class="eyebrow" id="stats-kicker"></p>
                <h2 id="stats-heading"></h2>
                <div id="standalone-stats"></div>
                <button class="ghost back-button" id="back-button"></button>
            </section>
            <div class="legend" id="legend" aria-label="Tile color guide"></div>
        </main>
        <footer><span id="footer-note"></span><a id="credit" rel="noreferrer" target="_blank"></a></footer>
    </div>
    <dialog id="help-dialog" aria-labelledby="help-title">
        <div class="modal-top"><span class="eyebrow" id="help-kicker"></span><button class="icon-button" id="close-help" aria-label="Close help"></button></div>
        <h2 id="help-title"></h2>
        <div id="help-rules"></div>
        <div class="help-examples" id="help-examples"></div>
        <p class="dry-line" id="dry-line"></p>
        <button class="primary help-start" id="help-start"></button>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
