<div class="sky" aria-hidden="true"></div>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#/" aria-label="Dreamio home"><span class="lm"><svg class="i"><use href="#i-moon"/></svg></span>Dreamio</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Stories</a>
      <a href="#/create" data-nav="create">Create</a>
      <button type="button" class="nav-btn" data-kids aria-label="Children profiles"><svg class="i"><use href="#i-users"/></svg><span class="hide-s">Children</span></button>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1" data-view></main>

<footer class="foot">
  <div class="wrap foot-in">
    <p><b>Dreamio</b> keeps stories, pictures and photos on this device only. Narration uses your browser's voices and music is generated in the browser.</p>
    <button type="button" class="link" data-reset>Reset demo stories</button>
  </div>
</footer>

<dialog class="dlg" data-kidsdlg aria-labelledby="kids-h">
  <form method="dialog" class="dlg-in" data-kidsform>
    <div class="dlg-h"><h2 id="kids-h">Children</h2><button class="icon-btn" value="cancel" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <p class="muted">Profiles name the hero of each story and let you sort the playlist by child.</p>
    <ul class="kids" data-kidlist></ul>
    <div class="kid-add"><label class="fld"><span>Name</span><input name="kname" maxlength="20" autocomplete="off" placeholder="e.g. Ava"></label><label class="fld age"><span>Age</span><input name="kage" type="number" min="1" max="12" value="5"></label><button type="button" class="btn sm" data-addkid><svg class="i"><use href="#i-plus"/></svg>Add</button></div>
    <p class="err" data-kiderr role="alert"></p>
  </form>
</dialog>

<div class="toasts" role="status" aria-live="polite" data-toasts></div>
<script src="app.js"></script>
