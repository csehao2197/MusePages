<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf4e9">
    <title>Softside Studio</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <a class="wordmark" href="./index.html"><svg viewBox="0 0 42 38" fill="none" aria-hidden="true"><path d="M7 25C0 13 14 2 22 8c8-9 22 6 13 16 1 11-16 13-18 5-6 7-14 3-10-4Z" stroke="currentColor" stroke-width="2"/><path d="M15 14c-6 4-4 12 1 11 5-1 0-13 8-12 9 2 7 11 2 11" stroke="currentColor" stroke-width="1.5"/></svg><span data-copy="brand"></span></a>
        <button id="sound" class="quiet" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 8c3 2 3 6 0 8M20 5c5 4 5 10 0 14"/></svg><span data-copy="soundOff"></span></button>
    </header>
    <main>
        <section class="playground" aria-labelledby="invitation">
            <div class="intro">
                <p class="eyebrow"><span></span><span data-copy="eyebrow"></span></p>
                <h1 id="invitation" data-copy="headline"></h1>
                <p class="description" data-copy="intro"></p>
                <div class="gesture"><svg viewBox="0 0 47 37" fill="none" aria-hidden="true"><path d="M3 9c5 20 24 22 35 6M29 14l12-3-1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span data-copy="gesture"></span></div>
            </div>
            <div class="studio">
                <div class="studio-top"><span class="edition" data-copy="edition"></span><span class="state"><i></i><span id="state" data-copy="resting"></span></span></div>
                <div id="stage" role="img"></div>
                <div class="studio-bottom"><span class="flavor-note"><i id="flavor-dot"></i><span id="flavor-note"></span></span><button id="squish" class="quiet small" data-copy="squish"></button></div>
            </div>
        </section>
        <section class="controls">
            <fieldset class="flavors"><legend data-copy="flavor"></legend><div id="flavors"></div></fieldset>
            <div class="stiffness"><label for="stiffness"><span data-copy="stiffness"></span><output id="stiffness-value">45</output></label><input id="stiffness" type="range" min="0" max="100" value="45"><div class="endpoints"><span data-copy="soft"></span><span data-copy="firm"></span></div></div>
            <button id="drop" class="primary"><span data-copy="drop"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 20h16"/></svg></button>
        </section>
        <div class="under-controls"><p data-copy="hint"></p><button id="reset" class="quiet small" data-copy="reset"></button></div>
        <p id="announcement" class="sr-only" aria-live="polite"></p>
    </main>
    <footer><span data-copy="footer"></span><a id="credit"></a></footer>
    <script type="module" src="./app.js"></script>
</body>
</html>
