<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music library</title>
    <link rel="icon" href="./public/images/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <aside id="sidebar"></aside>
    <div class="workspace">
        <header id="topbar"></header>
        <main id="main" tabindex="-1"></main>
    </div>
    <footer id="player"></footer>
    <nav id="mobile-nav" aria-label="Mobile navigation"></nav>
    <dialog id="queue-dialog" aria-labelledby="queue-title" aria-modal="true"></dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-modal="true"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <audio id="audio" preload="auto"></audio>
</body>
</html>
